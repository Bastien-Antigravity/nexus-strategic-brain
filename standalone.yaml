common:
    name: strategic_nexus
    common_file_path: ""
    public_key: ""
    reset: false
    public_ip: 127.0.0.1
    retry_base_ms: "100"
    retry_max_sec: "5"
capabilities:
    config_server:
        grpc_ip: ${CF_GRPC_IP:127.0.0.1}
        grpc_port: 3309
        ip: ${CF_IP:127.0.0.1}
        port: 3310
        refresh: "300"
        rest_port: 3311
    file_system:
        data_path: ./fs_data
        temp_path: ./fs_temp
    timescale_db:
        db_name: ${TS_DBNAME:maindb}
        ip: ${TS_IP:127.0.0.1}
        password: ${TS_PASSWORD:dbuser}
        port: ${TS_PORT:5432}
        ssl_cert: "false"
        user: ${TS_USER:dbuser}
    log_server:
        grpc_ip: ${LS_GRPC_IP:127.0.0.1}
        grpc_port: ${LS_GRPC_PORT:9021}
        ip: ${LS_IP:127.0.0.1}
        port: ${LS_PORT:9020}
    notif_server:
        grpc_ip: ${NT_GRPC_IP:127.0.0.1}
        grpc_port: ${NT_GRPC_PORT:1027}
        ip: ${NT_IP:127.0.0.1}
        port: ${NT_PORT:1026}
        rest_port: ${NT_REST_PORT:1029}
    strategic_nexus:
        mfe_port: 8092
